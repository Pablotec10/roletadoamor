
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#101747">
    <title>Roleta do Amor do Pablo e da Val </title>

    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            --navy: #111747;
            --gold: #f5bd3d;
            --pink: #df3150;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 20px;
            background: #080808;
            font-family: Arial, Helvetica, sans-serif;
        }

        .app {
            width: min(100%, 500px);
            min-height: 680px;
            overflow: hidden;
            background: #fffdfd;
            box-shadow: 0 18px 55px rgba(0,0,0,.45);
        }

        .topbar {
            min-height: 88px;
            padding: 15px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: white;
            background: var(--navy);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-icon {
            width: 43px;
            height: 43px;
            display: grid;
            place-items: center;
            border-radius: 13px;
            color: white;
            font-size: 25px;
            background: linear-gradient(145deg,#ff7596,#d92f65);
        }

        .brand h2 {
            margin: 0;
            font-size: 20px;
        }

        .brand p {
            margin: 4px 0 0;
            color: #c9cce4;
            font-size: 12px;
        }

        .header-heart {
            color: #f6c95f;
            font-size: 25px;
        }

        .content {
            padding: 27px 22px 25px;
            text-align: center;
        }

        h1 {
            margin: 4px 0 7px;
            font-size: clamp(28px,6vw,38px);
            font-weight: 400;
            color: #101010;
        }

        .subtitle {
            margin: 0 0 25px;
            color: #88818b;
            font-size: 13px;
        }

        .wheel-container {
            position: relative;
            width: min(100%,420px);
            aspect-ratio: 1;
            margin: 0 auto 23px;
            padding: 6px;
            border-radius: 50%;
            background: linear-gradient(145deg,#ffe18a,#e4a72c);
            box-shadow: 0 7px 18px rgba(0,0,0,.16);
        }

        .wheel {
            display: block;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            transition: transform 8s cubic-bezier(.10,.72,.10,1) !important;
            will-change: transform;
        }

        .segment {
            stroke: #fff8e9;
            stroke-width: 2.2;
        }

        .segment-label {
            fill: white;
            font-family: Arial, sans-serif;
            font-size: 10px;
            font-weight: 900;
            text-anchor: middle;
            dominant-baseline: middle;
            paint-order: stroke;
            stroke: rgba(0,0,0,.65);
            stroke-width: 1.5px;
            stroke-linejoin: round;
            pointer-events: none;
        }

        .pointer {
            position: absolute;
            z-index: 5;
            top: -3px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 14px solid transparent;
            border-right: 14px solid transparent;
            border-bottom: 27px solid #f2b82f;
            filter: drop-shadow(0 2px 2px rgba(0,0,0,.3));
        }

        .heart-button {
            position: absolute;
            z-index: 6;
            left: 50%;
            top: 50%;
            transform: translate(-50%,-50%);
            width: 31%;
            aspect-ratio: 1;
            border: 5px solid white;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 0;
            cursor: pointer;
            background: radial-gradient(circle,white,#fff0f3 72%,#f6cbd5);
            box-shadow: 0 2px 12px rgba(0,0,0,.25);
        }

        .heart-button:active {
            transform: translate(-50%,-50%) scale(.94);
        }

        .heart-button:disabled {
            cursor: wait;
        }

        .heart {
            color: #e52335;
            font-size: clamp(48px,12vw,76px);
            line-height: .95;
            text-shadow: 0 3px 4px rgba(0,0,0,.2);
        }

        .heart-caption {
            margin-top: 4px;
            color: #8d5362;
            font-size: 8px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .heart-button.is-spinning .heart {
            animation: heartbeat .65s infinite alternate;
        }

        @keyframes heartbeat {
            from { transform: scale(1); }
            to { transform: scale(1.12); }
        }

        .result {
            width: min(100%,420px);
            min-height: 72px;
            margin: 0 auto;
            padding: 12px 15px;
            border: 1px solid #eadde1;
            border-radius: 8px;
            background: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 6px;
            transition: .3s;
        }

        .result.is-revealed {
            background: #fff0f4;
            border-color: #edb7c7;
            transform: scale(1.015);
        }

        .result span {
            color: #9b6376;
            font-size: 9px;
            font-weight: bold;
            letter-spacing: 1.5px;
        }

        .result strong {
            color: #17113f;
            font-family: Georgia,serif;
            font-size: clamp(17px,4vw,21px);
        }

        .instruction {
            margin: 13px 0 0;
            color: #918994;
            font-size: 11px;
        }

        footer {
            padding: 14px 10px;
            border-top: 1px solid #eee7e9;
            color: #9a929b;
            text-align: center;
            font-size: 10px;
        }

        footer span {
            color: #e34b70;
        }

        @media(max-width:520px) {
            body {
                padding: 0;
                background: white;
            }

            .app {
                width: 100%;
                min-height: 100vh;
                box-shadow: none;
            }

            .topbar {
                min-height: 80px;
                padding: 13px 18px;
            }

            .content {
                padding: 25px 15px;
            }

            .wheel-container {
                width: min(100%,420px);
            }
        }

        @media(max-width:370px) {
            .segment-label {
                font-size: 9px;
            }

            .content {
                padding-inline: 10px;
            }
        }
    </style>
</head>

<body>

    <main class="app">

        <header class="topbar">
            <div class="brand">
                <div class="brand-icon">♥</div>
                <div>
                    <h2>Roleta do Amor</h2>
                    <p>do Pablo e da Val</p>
                </div>
            </div>

            <span class="header-heart">♥</span>
        </header>

        <section class="content">

            <h1>Roleta do Amor</h1>

            <p class="subtitle">
                Um toque no coração e deixe o amor decidir.
            </p>

            <div class="wheel-container">

                <div class="pointer"></div>

                <svg
                    id="wheel"
                    viewBox="0 0 420 420"
                    class="wheel"
                >
                    <g id="wheelArtwork"></g>
                </svg>

                <button
                    id="heartButton"
                    class="heart-button"
                    aria-label="Girar roleta"
                >
                    <span class="heart">♥</span>
                    <span class="heart-caption">TOQUE</span>
                </button>

            </div>

            <div class="result" id="result">
                <span id="resultLabel">A SORTE ESTÁ LANÇADA</span>
                <strong id="resultText">
                    Toque no coração para sortear ♥
                </strong>
            </div>

            <p class="instruction" id="instruction">
                Toque no coração para começar
            </p>

        </section>

        <footer>
            Roleta do Amor do Pablo e da Val <span>♥</span>
        </footer>

    </main>

    <script>
        // ==========================================
        // OPÇÕES DA ROLETA
        // ==========================================

        const OPTIONS = [
            "Beijo de Língua",
            "Val Decide",
            "Pablo Decide",
            "Cheiro no Cangote",
            "Mordidinha",
            "Beijo de Cabeça pra Baixo",
            "Selinho",
            "Abraço Apertado",
            "Declaração de Amor",
            "Impressione"
        ];

        const COLORS = [
            "#c90018",
            "#111111",
            "#c90018",
            "#111111",
            "#c90018",
            "#111111",
            "#c90018",
            "#111111",
            "#c90018",
            "#111111"
        ];

        const CENTER = 210;
        const RADIUS = 202;
        const SLICE = 360 / OPTIONS.length;
        const SPIN_DURATION = 8000;

        let currentRotation = 0;
        let isSpinning = false;
        let clickTimer = null;
        let finishTimer = null;
        let audioContext = null;

        const wheel = document.getElementById("wheel");
        const artwork = document.getElementById("wheelArtwork");
        const heartButton = document.getElementById("heartButton");
        const result = document.getElementById("result");
        const resultText = document.getElementById("resultText");
        const resultLabel = document.getElementById("resultLabel");
        const instruction = document.getElementById("instruction");


        // ==========================================
        // DESENHO DA ROLETA
        // ==========================================

        function polarToCartesian(cx, cy, radius, angle) {
            const radians = angle * Math.PI / 180;

            return {
                x: cx + radius * Math.cos(radians),
                y: cy + radius * Math.sin(radians)
            };
        }

        function createSegmentPath(startAngle, endAngle) {
            const start = polarToCartesian(
                CENTER,
                CENTER,
                RADIUS,
                startAngle
            );

            const end = polarToCartesian(
                CENTER,
                CENTER,
                RADIUS,
                endAngle
            );

            const largeArc = endAngle - startAngle > 180 ? 1 : 0;

            return `
                M ${CENTER} ${CENTER}
                L ${start.x} ${start.y}
                A ${RADIUS} ${RADIUS} 0 ${largeArc} 1 ${end.x} ${end.y}
                Z
            `;
        }

        function splitLabel(text, maxLength = 11) {
            const words = text.toUpperCase().split(" ");
            const lines = [];
            let currentLine = "";

            words.forEach(word => {
                const testLine = currentLine
                    ? currentLine + " " + word
                    : word;

                if (testLine.length > maxLength && currentLine) {
                    lines.push(currentLine);
                    currentLine = word;
                } else {
                    currentLine = testLine;
                }
            });

            if (currentLine) {
                lines.push(currentLine);
            }

            return lines;
        }

        function drawWheel() {
            artwork.innerHTML = "";

            OPTIONS.forEach((option, index) => {
                const startAngle = -90 + index * SLICE;
                const endAngle = startAngle + SLICE;
                const middleAngle = startAngle + SLICE / 2;

                const segment = document.createElementNS(
                    "http://www.w3.org/2000/svg",
                    "path"
                );

                segment.setAttribute(
                    "d",
                    createSegmentPath(startAngle, endAngle)
                );

                segment.setAttribute("fill", COLORS[index]);
                segment.setAttribute("class", "segment");

                artwork.appendChild(segment);

                const labelPosition = polarToCartesian(
                    CENTER,
                    CENTER,
                    137,
                    middleAngle
                );

                const textGroup = document.createElementNS(
                    "http://www.w3.org/2000/svg",
                    "g"
                );

                textGroup.setAttribute(
                    "transform",
                    `rotate(${middleAngle + 180}, ${labelPosition.x}, ${labelPosition.y})`
                );

                const lines = splitLabel(option, 11);
                const lineHeight = 13;
                const startY = -((lines.length - 1) * lineHeight) / 2;

                lines.forEach((line, lineIndex) => {
                    const text = document.createElementNS(
                        "http://www.w3.org/2000/svg",
                        "text"
                    );

                    text.setAttribute("x", labelPosition.x);
                    text.setAttribute(
                        "y",
                        labelPosition.y + startY + lineIndex * lineHeight
                    );

                    text.setAttribute("class", "segment-label");
                    text.textContent = line;

                    textGroup.appendChild(text);
                });

                artwork.appendChild(textGroup);
            });

            const border = document.createElementNS(
                "http://www.w3.org/2000/svg",
                "circle"
            );

            border.setAttribute("cx", CENTER);
            border.setAttribute("cy", CENTER);
            border.setAttribute("r", RADIUS);
            border.setAttribute("fill", "none");
            border.setAttribute("stroke", "#f8d77f");
            border.setAttribute("stroke-width", "3");

            artwork.appendChild(border);
        }

        drawWheel();


        // ==========================================
        // EFEITOS SONOROS
        // ==========================================

        function iniciarAudio() {
            if (!audioContext) {
                const AudioContextClass =
                    window.AudioContext || window.webkitAudioContext;

                if (AudioContextClass) {
                    audioContext = new AudioContextClass();
                }
            }

            if (audioContext && audioContext.state === "suspended") {
                audioContext.resume();
            }
        }

        function tocarClique(volume = 0.045) {
            if (!audioContext) return;

            const oscillator = audioContext.createOscillator();
            const gain = audioContext.createGain();

            oscillator.type = "sine";
            oscillator.frequency.setValueAtTime(
                950,
                audioContext.currentTime
            );

            gain.gain.setValueAtTime(
                volume,
                audioContext.currentTime
            );

            gain.gain.exponentialRampToValueAtTime(
                0.001,
                audioContext.currentTime + 0.045
            );

            oscillator.connect(gain);
            gain.connect(audioContext.destination);

            oscillator.start();
            oscillator.stop(audioContext.currentTime + 0.05);
        }

        function tocarVitoria() {
            if (!audioContext) return;

            const notas = [
                523.25,
                659.25,
                783.99,
                1046.50
            ];

            notas.forEach((frequencia, index) => {
                const oscillator = audioContext.createOscillator();
                const gain = audioContext.createGain();

                const inicio =
                    audioContext.currentTime + index * 0.13;

                oscillator.type = "sine";

                oscillator.frequency.setValueAtTime(
                    frequencia,
                    inicio
                );

                gain.gain.setValueAtTime(0.0001, inicio);

                gain.gain.exponentialRampToValueAtTime(
                    0.13,
                    inicio + 0.025
                );

                gain.gain.exponentialRampToValueAtTime(
                    0.001,
                    inicio + 0.32
                );

                oscillator.connect(gain);
                gain.connect(audioContext.destination);

                oscillator.start(inicio);
                oscillator.stop(inicio + 0.34);
            });
        }


        // ==========================================
        // SOM DE CLIQUES DURANTE O GIRO
        // ==========================================

        function iniciarCliques() {
            const startTime = performance.now();

            function scheduleClick() {
                if (!isSpinning) return;

                const elapsed = performance.now() - startTime;
                const progress = Math.min(elapsed / SPIN_DURATION, 1);

                tocarClique();

                const interval =
                    65 + Math.pow(progress, 2.8) * 480;

                clickTimer = setTimeout(
                    scheduleClick,
                    interval
                );
            }

            scheduleClick();
        }

        function pararCliques() {
            if (clickTimer) {
                clearTimeout(clickTimer);
                clickTimer = null;
            }
        }


        // ==========================================
        // FINALIZAÇÃO DO GIRO
        // ==========================================

        function finishSpin(selectedIndex) {
            if (!isSpinning) return;

            isSpinning = false;

            pararCliques();

            if (finishTimer) {
                clearTimeout(finishTimer);
                finishTimer = null;
            }

            heartButton.disabled = false;
            heartButton.classList.remove("is-spinning");

            result.classList.add("is-revealed");

            resultLabel.textContent = "O AMOR DECIDIU ♥";
            resultText.textContent = OPTIONS[selectedIndex];

            instruction.textContent =
                "Aproveitem o momento!";

            tocarVitoria();
        }


        // ==========================================
        // GIRAR ROLETA
        // ==========================================

        function spinWheel() {
            if (isSpinning) return;

            iniciarAudio();

            isSpinning = true;

            heartButton.disabled = true;
            heartButton.classList.add("is-spinning");

            result.classList.remove("is-revealed");

            resultLabel.textContent = "A SORTE ESTÁ LANÇADA";
            resultText.textContent = "Girando... ♥";

            instruction.textContent =
                "Deixe o amor decidir...";

            const selectedIndex = Math.floor(
                Math.random() * OPTIONS.length
            );

            const selectedCenter =
                selectedIndex * SLICE + SLICE / 2;

            const targetRotation =
                (360 - (selectedCenter % 360)) % 360;

            const currentAngle =
                ((currentRotation % 360) + 360) % 360;

            const adjustment =
                (targetRotation - currentAngle + 360) % 360;

            const extraTurns =
                3 + Math.floor(Math.random() * 3);

            currentRotation +=
                extraTurns * 360 + adjustment;

            wheel.style.transform =
                `rotate(${currentRotation}deg)`;

            iniciarCliques();

            finishTimer = setTimeout(() => {
                finishSpin(selectedIndex);
            }, SPIN_DURATION + 500);

            wheel.addEventListener(
                "transitionend",
                function onTransitionEnd(event) {
                    if (event.propertyName !== "transform") return;

                    wheel.removeEventListener(
                        "transitionend",
                        onTransitionEnd
                    );

                    finishSpin(selectedIndex);
                }
            );
        }


        // ==========================================
        // EVENTO DO CORAÇÃO
        // ==========================================

        heartButton.addEventListener("click", spinWheel);

    </script>

</body>
</html>
